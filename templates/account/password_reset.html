{% load i18n %}
{% load static %}
{% load pwa %}
{% progressive_web_app_meta %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Reset Password | Hangarin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #1a0010;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      display: flex;
      width: 900px;
      min-height: 540px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }
    /* LEFT PANEL */
    .left-panel {
      width: 42%;
      background: linear-gradient(135deg, #3a0020 0%, #8a0040 50%, #c0005a 100%);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1rem;
    }
    .brand-name {
      color: #fff;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .left-bottom h2 {
      color: #fff;
      font-weight: 800;
      font-size: 1.6rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .left-bottom p {
      color: rgba(255,255,255,0.75);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .dots {
      display: flex; gap: 8px; margin-top: 24px;
    }
    .dot {
      height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35);
    }
    .dot.active { background: #fff; width: 28px; }
    .dot:not(.active) { width: 16px; }

    /* RIGHT PANEL */
    .right-panel {
      width: 58%;
      background: #1a0818;
      padding: 52px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .right-panel h3 {
      color: #fff;
      font-weight: 800;
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    .right-panel .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      margin-bottom: 32px;
    }
    .right-panel .subtitle a {
      color: #FF85A1;
      font-weight: 700;
      text-decoration: none;
    }
    .form-label {
      color: rgba(255,255,255,0.75);
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .form-control {
      background: #2a0a20;
      border: 1.5px solid #4a1a35;
      border-radius: 10px;
      color: #fff;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
    }
    .form-control:focus {
      background: #2a0a20;
      border-color: #FF85A1;
      color: #fff;
      box-shadow: none;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.25); }
    .btn-signin {
      background: #F72585;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 13px;
      width: 100%;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-signin:hover { background: #d4006e; color: #fff; }
    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.5);
    }
    .back-link a {
      color: #FF85A1;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- LEFT -->
    <div class="left-panel">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-check-double"></i></div>
        <span class="brand-name">Hangarin</span>
      </div>
      <div class="left-bottom">
        <h2>Reset your password</h2>
        <p>We'll send you an email with instructions to reset your password.</p>
        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <h3>Forgot password?</h3>
      <p class="subtitle">
        Remember it? <a href="{% url 'account_login' %}">Sign in</a>
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required />
        </div>
        <button type="submit" class="btn-signin">Reset My Password</button>
      </form>
      <div class="back-link">
        <a href="{% url 'account_login' %}">← Back to Sign In</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
